name: Release

# Every release is tag-driven and publishes BOTH the source code and the
# binaries: GoReleaser cross-compiles the full matrix, builds the archives,
# packages, and a reproducible source tarball, generates SBOMs and checksums,
# creates the GitHub Release (body from the tagged CHANGELOG section), and
# updates the Homebrew/Scoop/Winget manifests. A build-provenance attestation is
# then signed for every artifact via the checksums file.
on:
  push:
    # v[0-9]* rather than v*: an annotation tag that happens to start with "v" -
    # v2-migration-record did - otherwise triggers a full release build, which
    # then fails in GoReleaser because the name is not semver. Nothing is
    # published either way, but the run is noise and the failure looks real.
    tags: ["v[0-9]*"]

  # Recovery path for when a tag push does not trigger anything - which is not
  # theoretical: during the 2026-08-06 Actions incident webhook delivery was
  # throttled and pushes stopped starting runs. Dispatch it with --ref pointing
  # at the tag, e.g. `gh workflow run release.yml --ref v3.0.1`.
  #
  # It stays tag-driven either way: GoReleaser reads the version from the ref it
  # is run against, so dispatching this on a branch fails at "current tag is not
  # semver" rather than publishing something unversioned.
  workflow_dispatch:

# Releases must never be cancelled mid-publish by a newer tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  goreleaser:
    # Linux cross-compiles every target (pure Go) and builds the native
    # deb/rpm/apk packages, so one ubuntu runner produces the full matrix.
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload assets
      id-token: write # keyless signing for the provenance attestation
      attestations: write # write the build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags for GoReleaser

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: true

      # syft powers GoReleaser's SBOM generation.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      # `go install` needs a tag named after the module's subdirectory: the
      # module is github.com/simtabi/ssh-manager/src/v3, so Go looks for
      # src/v3.0.1 and ignores v3.0.1 entirely. GoReleaser cannot be driven from
      # the prefixed tag - OSS rejects it as non-semver - so the release runs off
      # v3.0.1 and mirrors src/v3.0.1 onto the same commit here, where it cannot
      # be forgotten. src/... does not match this workflow's v[0-9]* trigger, so
      # pushing it starts no second run.
      #
      # It runs before GoReleaser rather than after: `go install` builds from
      # source and needs no release assets, so an alias tag on a release that
      # later failed is still self-consistent - whereas a release whose alias
      # never got pushed is not installable at all. Re-running a failed release
      # finds the tag already there and skips it.
      - name: Mirror the tag Go resolves the module through
        run: |
          alias_tag="src/${GITHUB_REF_NAME}"
          if git rev-parse -q --verify "refs/tags/${alias_tag}" >/dev/null; then
            echo "${alias_tag} already exists"
          else
            git tag "${alias_tag}" "${GITHUB_REF_NAME}"
            git push origin "${alias_tag}"
            echo "pushed ${alias_tag}"
          fi

      # Written outside the working tree: GoReleaser refuses to release from a
      # dirty checkout, and an untracked release_notes.md in the repo root is
      # exactly that. This failed the first release attempted after the step was
      # added, having never been exercised before it.
      - name: Extract CHANGELOG section for this tag
        run: ./src/scripts/extract-changelog.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release_notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean --config src/.goreleaser.yaml --release-notes=${{ runner.temp }}/release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          # Scoop/Winget publishing is skipped until the bucket/fork exist. Set
          # repo variable SKIP_WINDOWS_PKGS to "false" to enable it.
          SKIP_WINDOWS_PKGS: ${{ vars.SKIP_WINDOWS_PKGS || 'true' }}

      # Sign a build-provenance attestation for every released artifact. The
      # checksums file lists them all, so `gh attestation verify <file>
      # --repo <owner>/<repo>` works for any downloaded binary or archive.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: build/dist/checksums.txt
