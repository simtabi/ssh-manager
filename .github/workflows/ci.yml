name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (not on main pushes, which we keep).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The whole product: pure Go, every verb native. Build, vet, test and gofmt
    # across the three first-class OSes - the Windows leg matters because the
    # platform layer (icacls, schtasks, toast, console modes) only runs there.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      # One gate, defined once, in the Makefile. Reimplementing these steps here
      # let the local `make check` and CI drift apart silently.
      - name: Gate
        shell: bash
        run: make ci
      # Once per OS, not once overall: golangci-lint analyses a single GOOS, so
      # a single run never sees the build-tagged platform files at all.
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2
      # No longer macOS-only: the shell version used BSD `stat -f`, which was the
      # single reason two thirds of the matrix never ran it.
      - name: E2E smoke
        if: runner.os != 'Windows'
        shell: bash
        run: make e2e


  pre-commit:
    # pre-commit is itself a Python tool; the hooks it runs here are gitleaks,
    # file hygiene, and gofmt/go vet. This is the only Python left in CI.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  gitleaks:
    # Run the gitleaks binary directly: gitleaks-action@v2 requires a paid
    # GITLEAKS_LICENSE for organisation-owned repos (simtabi is an org).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: gitleaks detect --source . --redact --no-banner --exit-code 1

  scripts:
    # The four shell artifacts nothing else exercises. install.sh and install.ps1
    # are user-facing `curl | bash` entry points with no test of any kind - a
    # broken arch detection or a renamed asset would surface as a user report -
    # and fixkeys.sh runs as root on a machine its user is locked out of.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --severity=warning \
            scripts/install.sh \
            scripts/build-all.sh \
            scripts/extract-changelog.sh \
            internal/services/recover/fixkeys.sh
      - name: PowerShell parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Output "scripts/install.ps1 parses"
      - name: The installers reconstruct the artifact names GoReleaser writes
        run: |
          # Both installers build "sshmgr_{os}_{arch}", and .goreleaser.yaml maps
          # darwin -> macos. A drift here is invisible until a release is cut.
          grep -q 'darwin' scripts/install.sh || { echo "install.sh no longer maps darwin"; exit 1; }
          grep -q 'macos'  scripts/install.sh || { echo "install.sh no longer produces the macos token"; exit 1; }
          grep -q 'macos'  .goreleaser.yaml   || { echo ".goreleaser.yaml no longer produces the macos token"; exit 1; }
          grep -q 'checksums.txt' scripts/install.sh || { echo "install.sh stopped verifying checksums"; exit 1; }
          grep -qi 'checksums.txt' scripts/install.ps1 || { echo "install.ps1 stopped verifying checksums"; exit 1; }
          echo "installers and GoReleaser agree on the artifact naming"
