name: CI

on:
  # Manually runnable, from the Actions tab or `gh workflow run`. Push events are
  # not a reliable trigger: during the 2026-08-06 Actions incident GitHub
  # throttled webhook delivery, so four consecutive pushes to main produced no
  # runs at all and there was no supported way to ask for one. It is also how you
  # re-run a green commit after changing a secret or a runner image, without
  # pushing an empty commit to do it.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (not on main pushes, which we keep).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The whole product: pure Go, every verb native. Build, vet, test and gofmt
    # across the three first-class OSes - the Windows leg matters because the
    # platform layer (icacls, schtasks, toast, console modes) only runs there.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # One gate, defined once, in the Makefile. Reimplementing these steps here
      # let the local `make check` and CI drift apart silently.
      - name: Gate
        shell: bash
        run: make ci
      # Once per OS, not once overall: golangci-lint analyses a single GOOS, so
      # a single run never sees the build-tagged platform files at all.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          # The module is src/, and the action runs where it is told to. Without
          # this it lints a directory with no Go in it and passes.
          working-directory: src
      # No longer macOS-only: the shell version used BSD `stat -f`, which was the
      # single reason two thirds of the matrix never ran it.
      - name: E2E smoke
        if: runner.os != 'Windows'
        shell: bash
        run: make e2e


  gitleaks:
    # The only secret scanner now, and the only one that ever mattered: it runs
    # against the full history, which the pre-commit hook of the same name could
    # not do. That hook, and the interpreter the pre-commit job needed to run
    # it, are gone; its file-hygiene rules are Go tests in cmd/sshmgr.
    #
    # Run the gitleaks binary directly: gitleaks-action@v2 requires a paid
    # GITLEAKS_LICENSE for organisation-owned repos (simtabi is an org).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: gitleaks detect --source . --redact --no-banner --exit-code 1

  scripts:
    # The four shell artifacts nothing else exercises. install.sh and install.ps1
    # are user-facing `curl | bash` entry points with no test of any kind - a
    # broken arch detection or a renamed asset would surface as a user report -
    # and fixkeys.sh runs as root on a machine its user is locked out of.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --severity=warning \
            src/scripts/install.sh \
            src/scripts/build-all.sh \
            src/scripts/extract-changelog.sh \
            src/internal/services/recover/fixkeys.sh
      - name: PowerShell parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "src/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Output "src/scripts/install.ps1 parses"
      - name: The installers reconstruct the artifact names GoReleaser writes
        run: |
          # Both installers build "sshmgr_{os}_{arch}", and .goreleaser.yaml maps
          # darwin -> macos. A drift here is invisible until a release is cut.
          grep -q 'darwin' src/scripts/install.sh || { echo "install.sh no longer maps darwin"; exit 1; }
          grep -q 'macos'  src/scripts/install.sh || { echo "install.sh no longer produces the macos token"; exit 1; }
          grep -q 'macos'  src/.goreleaser.yaml  || { echo ".goreleaser.yaml no longer produces the macos token"; exit 1; }
          grep -q 'checksums.txt' src/scripts/install.sh || { echo "install.sh stopped verifying checksums"; exit 1; }
          grep -qi 'checksums.txt' src/scripts/install.ps1 || { echo "install.ps1 stopped verifying checksums"; exit 1; }
          echo "installers and GoReleaser agree on the artifact naming"
