name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning needs GitHub Advanced Security on private repos, which this
    # repo does not have. Run only when public, so it self-activates at go-public
    # without failing every push while private.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # A job-level permissions block REPLACES the workflow-level one, so
      # checkout needs contents:read explicitly to clone the (private) repo.
      contents: read
      actions: read            # read workflow metadata (needed on private repos)
      security-events: write   # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        # Scan the Go code and the workflow files themselves. This said `python`
        # until the rewrite landed, so the product went unscanned: the Python it
        # was aimed at is gone, and the Go that replaced it was never analysed.
        language: [go, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pin the toolchain from go.mod. CodeQL's autobuild otherwise uses whatever
      # Go the runner image ships, which need not satisfy the module's directive.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: src/go.mod
          # No build cache here, deliberately. CodeQL learns what the code is by
          # observing the compiler run; a restored cache makes `go build` a no-op
          # and it observes nothing, which is what "detected code written in Go
          # but this run didn't build any of it" means. The scan then fails - or,
          # worse on a different day, reports a clean result for a codebase it
          # never read.
          cache: false
      - uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: ${{ matrix.language }}
          # Go is extracted from source rather than by watching a compiler run.
          #
          # build-mode: manual was tried first and failed twice with "detected
          # code written in Go but this run didn't build any of it": the build
          # step ran and succeeded, but CodeQL's tracer observed nothing from it.
          # That failure mode is the dangerous one - the same configuration on a
          # more forgiving day reports a clean scan of a codebase it never read,
          # which looks exactly like coverage.
          #
          # "none" removes the tracing step from the equation: CodeQL reads the
          # source directly, so it does not matter which directory the module
          # lives in or whether a build cache made the compiler a no-op.
          build-mode: none
      - uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
