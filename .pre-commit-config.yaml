# Local safety net (secrets + hygiene + lint). Run: pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
        # recover_test.go feeds a private-key header to the code that must
        # REFUSE it - a user saving a private key to the .pub path is the error
        # being tested, so the header is the fixture. Two lines, no key material.
        exclude: ^src/internal/services/recover/recover_test\.go$
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      - id: check-json
  - repo: local
    hooks:
      # `gofmt -l` prints unformatted files and still exits 0, so on its own it
      # could never fail a commit - it listed the problem and passed. The test
      # turns that listing into an exit code.
      - id: gofmt
        name: gofmt
        entry: bash -c 'out=$(gofmt -l "$@") && test -z "$out" || { echo "$out"; exit 1; }' --
        language: system
        types: [go]
      # go.mod is in src/, so a bare `go vet ./...` at the repo root has no
      # packages to inspect and passes without inspecting anything.
      - id: go-vet
        name: go vet
        entry: go -C src vet ./...
        language: system
        types: [go]
        pass_filenames: false
